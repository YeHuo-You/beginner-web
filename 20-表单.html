<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表单</title>
</head>
<body>
    <!-- 作用：收集用户信息
    使用场景：登录页面，注册页面，搜索区域 -->

    <!-- input标签：type属性值不同，则功能不同 
     text：文本框，用于输入单行文本（不换行）
     password：密码框（隐藏输入内容）
     radio：单选框(圆形框)
     checkbox：多选框（方形框）
     file：上传文件-->

    姓名：<input type="text">
    <br>
    密码：<input type="password">
    <br>
    性别：<input type="radio">
    <br>
    爱好：<input type="checkbox">
    <br>
    附件：<input type="file">
    <br><br>

    <!-- input标签占位文本：提示信息（文本框和密码框都可以使用） -->
    文本框：<input type="text" placeholder="请输入用户名">
    <br>
    密码框：<input type="password" placeholder="请输入密码">
    <br><br>

    <!-- 单选框radio常用属性：
     name：控件名称，控件分组，同组只能选中一个（单选功能），引号中名字自取，最好见名知意
     checked：默认选中，属性名和属性值相同，简写为一个单词checked -->
    性别：
    <input type="radio" name="gender">男
    <input type="radio" name="gender" checked>女
    <br><br>

    <!-- 默认情况下，文件上传表单控件只能上传一个文件，添加multiple属性可以实现文件多选功能 -->
    上传文件：<input type="file" multiple>
    <br><br>

    <!-- 多选框（复选框）checkbox
    默认选中：checked -->
    兴趣爱好：
    <input type="checkbox">敲代码
    <input type="checkbox" checked>敲前端代码
    <input type="checkbox" checked>敲前端HTML代码
    <br><br>

    <!-- 下拉菜单：select嵌套option，select是下拉菜单整体，option是下拉菜单的每一项
    selected默认选中 -->
    城市：
    <select>
        <option>北京</option>
        <option>上海</option>
        <option>武汉</option>
        <option selected>深圳</option>
    </select>
    <br><br>

    <!-- 文本域：多行输入文本的表单控件
    右下角两个斜杠，可以拖拽以改变文本域大小，工作中禁用
    未来会用CSS设置尺寸 -->
    <textarea>请输入评论</textarea>
    <br><br>

    <!-- label标签：网页中，某个标签的说明文本
    用label标签绑定文字和表单控件的关系，增大表单控件（文本框、密码框、上传文件、单选框、多选框、下拉菜单、文本域等等）的点击范围 -->
    <!-- 写法1：label标签只包裹内容，不包裹表单控件
    设置label标签的for属性值和表单控件的id属性值相同 -->
    性别：
    <input type="radio" id="men" name="gender1">
    <label for="men">男</label>
    <input type="radio" id="women" name="gender1">
    <label for="women">女</label>
    <br>
    <!-- 写法2：使用label标签包裹文字和表单控件，不需要属性 -->
    性别：
    <label><input type="radio" name="gender2">男</label>
    <label><input type="radio" name="gender2">女</label>
    <br><br>

    <!-- 按钮-button
     type属性值：
     submit提交按钮，点击后可以提交数据到后台（默认功能）
     reset重置按钮，点击后将表单控件恢复默认值
     button普通按钮，默认没有功能，一般配合JavaScript使用
     要用form表单区域标签包裹起来才起作用 -->
    <!-- action发送数据的地址，数据交到哪里 -->
    <form action="">
        用户名：<input type="text" placeholder="请输入用户名">
        <br>
        密码：<input type="password" placeholder="请输入密码">
        <br>
        <!-- 省略type属性，功能是提交 -->
        <button>提交</button>
        <button type="reset">重置</button>
        <button type="button">普通按钮</button>
    </form>
    <br><br>

    <!-- 无语义的布局标签：布局网页（划分网页区域，摆放内容）
     div：独占一行（大盒子）
     span：不换行（小盒子）
     都是双标签 -->
    <div>这是div标签</div>
    <div>这是div标签</div>
    <span>这是span标签</span>
    <span>这是span标签</span>
    <br><br>

    <!-- 字符实体：在网页中显示预留字符
      空格&nbsp;
     <小于号&lt;
     >大于号&gt;-->
    乾坤未定，你我皆是黑           马。
    乾坤未定，你我皆是黑&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;马。
    <!-- 在代码中敲键盘的空格，网页只识别一个空格 -->
    <p><!-- 这是p标签，网页中无法显示 -->
    &lt;p&gt;
</body>
</html>
