<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初识CSS</title>
    <style>
        p{
            /* 文字颜色 */
            color:red;
            /* 字号 */
            font-size: 30px;
        }
    </style>
</head>
<body>
    层叠样式表（Cascading Style Sheets，缩写为CSS），是一种样式表语言，用来描述HTML文档的呈现（美化内容）。
    <br>
    书写位置：title标签下方（CSS是给浏览器看的）添加style双标签，style标签里面书写CSS代码。
    <br><br>
    &lt;style&gt;<br>
    /*选择器*/<br>
    p{<br>
        /*CSS属性*/<br>
        属性名：属性值；(成对出现，称为键值对)<br>
        color：red；<br>
    }<br>
    &lt;/style&gt;<br><br>

    <p>体验CSS</p>
</body>
</html>
