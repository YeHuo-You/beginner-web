<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字颜色</title>
    <style>
        h1{
            /* 颜色关键字:颜色英文单词(学习测试) */
            color: red;
        }
        h2{
            /* rgb表示法:r,g,b表示红绿蓝三原色,取值0-255(了解) */
            color: rgb(0,255,0);
        }
        h3{
            /* rgba表示法:a表示透明度,取值0-1(开发使用,实现透明色) */
            color: rgba(0,0,0,0.3);
        }
        h4{
            /* 十六进制表示法:#RRGGBB,简写#RGB,两两一组,相同可化简为一个数(开发使用,从设计稿复制) */
            color: #0000ff;
        }
    </style>
</head>
<body>
    <h1>h1标签</h1>
    <h2>h2标签</h2>
    <h3>h3标签</h3>
    <h4>h4标签</h4>
</body>
</html>
