<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>列表</title>
</head>
<body>
    <!-- 无序列表 -->
    <ul>
        <li>列表条目1</li>
        <li>列表条目2</li>
        <li>列表条目3</li>
    </ul>
    <!-- 有序列表 -->
    <ol>
        <li>步骤1</li>
        <li>步骤2</li>
        <li>步骤3</li>
    </ol>

    <!-- 定义列表 -->
    <!-- dl嵌套dt（定义列表的标题）和dd（定义列表的描述/详情） -->
    <!-- 一般用在页面底部，类似帮助中心 -->
    <dl>
        <dt>服务中心</dt>
        <dd>申请售后</dd>
        <dd>售后政策</dd>
    </dl>

    <!-- ul/ol/dl标签里面只能包裹li标签，li/dt/dd标签里面可以包裹任何内容 -->
</body>
</html>
