<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快捷键&小窍门</title>
</head>
<body>
    <h3>一些快捷键&小窍门</h3>
    <ol>
    <li>Ctrl+/注释</li>
    <li>Ctrl+,打开设置</li>
    <li>在设置搜索word wrap（自动换行），选择on（打开），长行会随界面宽度自己折行，更好查看</li>
    <li>Ctrl+z撤销</li>
    <li>home跳到行首，end跳到行尾（实现快速换行）；Ctrl+home跳到文档最前面，Ctrl+end跳到文档最后面</li>
    <li>Ctrl+home跳到文件开头，Ctrl+end跳到文件结尾</li>
    <li>Alt+B在默认浏览器里打开</li>
    <li>Tab缩进，Shift+Tab缩回（选中内容后用快捷键，可整体缩进/缩回）</li>
</ol>
</body>
</html>
