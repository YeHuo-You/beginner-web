<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择器</title>
    <style>
        /* 选中同名标签设置相同的样式，无法差异化同名标签的样式 */
        p{
            color: red;
        }
        /* 类名要见名知意，多个单词可以用-连接，例如：news-hd(head的简写) */
        .blue{
            color: blue;
        }
        .size{
            font-size: 50px;
        }
    </style>
</head>
<body>
    <!-- 作用：查找标签，设置样式 -->
    <!-- 基础选择器
         1.标签选择器：使用标签名作为选择器 → 选中同名标签设置相同的样式
         2.类选择器：查找标签：差异化设置标签的显示效果 -->
    <!-- 标签选择器 -->
    <p>这是p标签</p>
    <p>111</p>

    <!-- 类选择器 -->
    <!-- 一个类选择器可以给多个标签使用 -->
    <div class="blue">你好</div>
    <!-- 一个标签可以使用多个类名，类名用空格隔开 -->
    <div class="blue size">hello</div>
</body>
</html>
